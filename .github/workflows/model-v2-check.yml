name: Model V2 checks

on:
  push:
    branches: [model-v2, totals-v3]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py app_v2.py backtest.py modules
      - name: V2 feature smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from modules.feature_engineering import clean_history, add_rolling_features
          from modules.ml_engine import PredictorML
          df = clean_history(pd.read_csv('data/historico_ligamx_completo.csv'))
          assert len(df) >= 300, 'Historico insuficiente'
          feat = add_rolling_features(df)
          assert 'Diff_ELO_Pre' in feat.columns
          assert 'H_GF_5' in feat.columns
          assert 'A_GA_5' in feat.columns
          ml = PredictorML()
          assert ml.entrenar(df), 'ML no pudo entrenar'
          assert len(ml.features) >= 20, 'Muy pocas features prepartido'
          print('V2 smoke test OK', len(df), len(ml.features))
          PY
      - name: V3 totals math smoke test
        run: |
          python - <<'PY'
          from modules.scanner_engine import _evaluate_total_side, _supported_total_line
          assert _supported_total_line(2.5)
          assert _supported_total_line(3.0)
          assert not _supported_total_line(2.25)
          pick, diag = _evaluate_total_side(
              'Test A vs Test B', 'Goles O/U', 'Over 2.5',
              68.0, 64.0, 0.0, 0.0, 1.80, 55.0, 'TestBook'
          )
          assert pick is not None, diag
          assert pick['EV_pct'] > 0
          # Línea entera: 10% push no debe contarse como pérdida.
          pick2, diag2 = _evaluate_total_side(
              'Test A vs Test B', 'Goles O/U', 'Over 3.0',
              66.0, 62.0, 10.0, 10.0, 1.95, 54.0, 'TestBook'
          )
          assert diag2['P_Push'] == 10.0
          print('V3 totals smoke test OK')
          PY
      - name: Production Streamlit startup smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 >/tmp/streamlit-v2.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            cat /tmp/streamlit-v2.log
            kill $PID || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8501/_stcore/health
          kill $PID || true
      - name: Walk-forward backtest
        run: python backtest.py data/historico_ligamx_completo.csv | tee backtest_metrics.txt
      - name: Upload backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: model-v2-backtest
          path: |
            backtest_metrics.txt
            backtest_predictions.csv
