name: Model V2 checks

on:
  push:
    branches: [model-v2, totals-v3, cloud-run-migration]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py app_v2.py app_cloudrun.py app_cloudrun_integrated.py app_cloudrun_v5.py backtest.py modules
      - name: V2 feature smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from modules.feature_engineering import clean_history, add_rolling_features
          from modules.ml_engine import PredictorML
          df = clean_history(pd.read_csv('data/historico_ligamx_completo.csv'))
          assert len(df) >= 300, 'Historico insuficiente'
          feat = add_rolling_features(df)
          assert 'Diff_ELO_Pre' in feat.columns
          assert 'H_GF_5' in feat.columns
          assert 'A_GA_5' in feat.columns
          ml = PredictorML()
          assert ml.entrenar(df), 'ML no pudo entrenar'
          assert len(ml.features) >= 20, 'Muy pocas features prepartido'
          print('V2 smoke test OK', len(df), len(ml.features))
          PY
      - name: Odds market-coherence smoke test
        run: |
          python - <<'PY'
          from modules.odds_engine import _candidate_from_book, _best_1x2, _best_total
          books = [
            {'id': 8, 'name': 'Book A', 'bets': [
              {'name': 'Match Winner', 'values': [
                {'value':'Home','odd':'2.10'}, {'value':'Draw','odd':'3.20'}, {'value':'Away','odd':'3.40'}
              ]}
            ]},
            {'id': 99, 'name': 'Book B', 'bets': [
              {'name': 'Goals Over/Under', 'values': [
                {'value':'Over 2.5','odd':'1.91'}, {'value':'Under 2.5','odd':'1.93'}
              ]}
            ]}
          ]
          c = [_candidate_from_book(x) for x in books]
          assert _best_1x2(c)['bookmaker_name'] == 'Book A'
          assert _best_total(c, 'goles', 'Goles')['bookmaker_name'] == 'Book B'
          print('Odds coherence smoke test OK')
          PY
      - name: Asian totals math smoke test
        run: |
          python - <<'PY'
          import numpy as np
          from modules.montecarlo_sim import _asian_side_probs
          from modules.scanner_engine import _evaluate_total_side, _supported_total_line
          assert _supported_total_line(2.5)
          assert _supported_total_line(3.0)
          assert _supported_total_line(2.25)
          assert _supported_total_line(2.75)
          x = np.array([2, 3, 4, 3])
          o225 = _asian_side_probs(x, 2.25, 'over')
          assert o225['half_loss'] == 25.0 and o225['win'] == 75.0, o225
          o275 = _asian_side_probs(x, 2.75, 'over')
          assert o275['half_win'] == 50.0 and o275['win'] == 25.0, o275
          pick, diag = _evaluate_total_side(
              'Test A vs Test B', 'Goles O/U', 'Over 2.75',
              58.0, 56.0, 0.0, 0.0, 2.00, 50.0, 'TestBook',
              min_prob=50.0, min_edge=0.0, min_ev=0.0,
              half_win_stat=20.0, half_win_ml=18.0,
              half_loss_stat=0.0, half_loss_ml=0.0,
              loss_stat=22.0, loss_ml=26.0,
          )
          assert diag['P_HalfWin'] > 0
          assert diag['Cuota_Justa_Modelo'] is not None
          print('Asian totals smoke test OK', diag)
          PY
      - name: Short-sample stats fallback smoke test
        run: |
          python - <<'PY'
          import pandas as pd
          from modules.feature_engineering import clean_history
          from modules.stats_engine import calcular_expectativa_partido
          df = clean_history(pd.read_csv('data/historico_ligamx_completo.csv'))
          teams = sorted(set(df.Local) | set(df.Visitante))
          candidate = None
          for h in teams:
              for a in teams:
                  if h == a:
                      continue
                  hs = int((df.Local == h).sum())
                  aas = int((df.Visitante == a).sum())
                  ht = int(((df.Local == h) | (df.Visitante == h)).sum())
                  at = int(((df.Local == a) | (df.Visitante == a)).sum())
                  if ht >= 5 and at >= 5 and (hs < 8 or aas < 8):
                      candidate = (h, a)
                      break
              if candidate:
                  break
          if candidate:
              e = calcular_expectativa_partido(candidate[0], candidate[1], df=df)
              assert e['fallback_stats'] is True
              assert e['lambda_goles_local'] > 0 and e['lambda_goles_visita'] > 0
              print('Fallback smoke test OK', candidate)
          else:
              print('No natural short-sample pair in current history; fallback code compiled')
          PY
      - name: Production Flask import smoke test
        run: |
          python - <<'PY'
          from app_cloudrun_v5 import app
          rules = {r.rule for r in app.url_map.iter_rules()}
          assert '/health' in rules
          assert '/api/fixtures' in rules
          assert '/api/analyze' in rules
          assert '/api/scan' in rules
          print('Cloud Run Flask import OK')
          PY
      - name: Walk-forward backtest
        run: python backtest.py data/historico_ligamx_completo.csv | tee backtest_metrics.txt
      - name: Upload backtest outputs
        uses: actions/upload-artifact@v4
        with:
          name: model-v2-backtest
          path: |
            backtest_metrics.txt
            backtest_predictions.csv
