name: Verificar cartelera Liga MX (legacy)

on:
  workflow_dispatch:

# Este flujo legacy ya NO genera ni publica cuotas.
# Las cuotas reales de producción se consultan en tiempo real mediante API-Football
# desde modules/odds_engine.py. Se mantiene únicamente como ejecución manual
# de diagnóstico para evitar que un CSV con valores 0.00 se confunda con líneas reales.

jobs:
  legacy-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Informar fuente activa de cuotas
        run: |
          echo "Producción: API-Football -> modules/odds_engine.py"
          echo "Este workflow no escribe data/cuotas_jornada.csv ni hace commits automáticos."
